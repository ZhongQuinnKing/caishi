name: smoke

# 冒烟测试·每周一跑（只查返回结构没崩；真机档在本机跑，CI 只跑定义档）
# 定义档＝opencli validate 六个自研站 ＋ clis/*.js 语法检查；真机档需 Chrome 与登录态，不进 CI。

on:
  schedule:
    - cron: '17 1 * * 1'   # 每周一 01:17 UTC（北京 09:17），避开整点
  workflow_dispatch:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install opencli
        run: npm install -g @jackwener/opencli@1.8.8

      - name: Install in-house clis
        run: |
          mkdir -p "$HOME/.opencli/clis"
          cp -R clis/. "$HOME/.opencli/clis/"

      - name: Run smoke (definition tier)
        run: bash scripts/smoke.sh
